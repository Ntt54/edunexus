[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollama-tutor"
version = "0.1.0"
description = "EduNexus — local AI tutor: document library, spaced-repetition, exercises and RAG over your books (CPU-friendly, Ollama/GGUF-backed)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "numpy>=1.26",
    "pypdf>=4.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "jsonschema>=4.18.0",
]

[project.scripts]
edunexus = "ollama_tutor.web.__main__:main"
ollama-tutor-webgui = "ollama_tutor.web.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_tutor"]
